name: CI Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and verify compilation
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=linuxdeepin/deepin:crimson \
            --load \
            -t tetris-ci \
            -f .github/workflows/Dockerfile .

      - name: Verify .deb was produced
        run: |
          docker create --name verify tetris-ci
          echo "=== Package contents ==="
          docker cp verify:/output/. ./dist/
          docker rm verify
          ls -lh dist/
          file dist/*.deb

  build-uab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linyaps package
        run: |
          docker build \
            --build-arg BASE_IMAGE=linuxdeepin/deepin:crimson \
            --load \
            -t tetris-ci-uab \
            -f .github/workflows/Dockerfile.linyaps .

      - name: Verify .uab was produced
        run: |
          docker create --name verify-uab tetris-ci-uab
          mkdir -p dist-uab
          docker cp verify-uab:/output/. ./dist-uab/
          docker rm verify-uab
          ls -lh dist-uab/
          file dist-uab/*.uab
