name: CI Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and verify compilation
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=linuxdeepin/deepin:crimson \
            --load \
            -t tetris-ci \
            -f .github/workflows/Dockerfile .

      - name: Verify .deb was produced
        run: |
          docker create --name verify tetris-ci
          echo "=== Package contents ==="
          docker cp verify:/output/. ./dist/
          docker rm verify
          ls -lh dist/
          file dist/*.deb

  build-uab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker base image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=linuxdeepin/deepin:crimson \
            --load \
            -t tetris-uab-base \
            -f .github/workflows/Dockerfile.linyaps .

      - name: Build linyaps package
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            tetris-uab-base \
            bash -c "ll-builder build --skip-fetch-source && LANG=C LC_ALL=C ll-builder export"

      - name: Verify .uab was produced
        run: |
          ls -lh *.uab
          file *.uab
