name: CI Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and verify compilation
        run: |
          mkdir -p dist
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=linuxdeepin/deepin:crimson \
            --output type=local,dest=dist \
            -f .github/workflows/Dockerfile .

      - name: Verify .deb was produced
        run: |
          ls -lh dist/
          file dist/*.deb
