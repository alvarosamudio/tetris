name: Build and publish .deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base_image: linuxdeepin/deepin:crimson
          - arch: arm64
            platform: linux/arm64
            base_image: linuxdeepin/deepin:crimson-arm64
          - arch: riscv64
            platform: linux/riscv64
            base_image: linuxdeepin/deepin:crimson-riscv64
          - arch: loong64
            platform: linux/loong64
            base_image: linuxdeepin/deepin:crimson-loong64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Docker image and package .deb
        run: |
          mkdir -p dist
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg BASE_IMAGE=${{ matrix.base_image }} \
            --output type=local,dest=dist \
            --cache-from type=gha,scope=${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.arch }} \
            -t tetris-builder:${{ matrix.arch }} \
            -f .github/workflows/Dockerfile .

      - name: Rename .deb with architecture suffix
        id: deb-info
        run: |
          deb_file=$(ls dist/*.deb | grep -v dbgsym | head -n 1)
          new_name="${deb_file##*/}"
          echo "path=$deb_file" >> $GITHUB_OUTPUT
          echo "name=$new_name" >> $GITHUB_OUTPUT
          echo "Found: $new_name"

      - name: Upload .deb as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.deb-info.outputs.name }}
          path: ${{ steps.deb-info.outputs.path }}

      - name: Install linyaps builder (amd64 host)
        if: matrix.arch == 'amd64'
        run: |
          sudo groupadd -f ssl-cert
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Deepin_25/ ./" | \
            sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linglong-builder
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build linyaps package from .deb
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p linglong/sources
          cp dist/tetris_*.deb linglong/sources/
          ll-builder build --skip-fetch-source
          LANG=C LC_ALL=C ll-builder export

      - name: List linyaps output
        if: matrix.arch == 'amd64'
        run: |
          echo "Generated linyaps packages:"
          ls -lh *.uab

      - name: Upload .uab as artifact
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linyaps-uab-${{ matrix.arch }}
          path: '*.uab'

      - name: Upload to Release
        uses: softprops/action-gh-release@v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.deb-info.outputs.path }}
          generate_release_notes: true

      - name: Upload linyaps package to Release
        uses: softprops/action-gh-release@v3.0.2
        if: startsWith(github.ref, 'refs/tags/') && matrix.arch == 'amd64'
        with:
          files: '*.uab'
          generate_release_notes: false

