<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#131313"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fallglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ac8ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5ac8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gCoral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fa5a5a"/>
      <stop offset="1" stop-color="#c84848"/>
    </linearGradient>
    <linearGradient id="gPeri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e82ff"/>
      <stop offset="1" stop-color="#5868cc"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffaa28"/>
      <stop offset="1" stop-color="#cc881f"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd246"/>
      <stop offset="1" stop-color="#cca838"/>
    </linearGradient>
    <linearGradient id="gMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46c88c"/>
      <stop offset="1" stop-color="#38a070"/>
    </linearGradient>
    <linearGradient id="gOrchid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c85af0"/>
      <stop offset="1" stop-color="#a048c0"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ac8ff"/>
      <stop offset="1" stop-color="#48a0cc"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="2" y="2" width="124" height="124" rx="24" ry="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="24" ry="24" fill="url(#vignette)"/>
  <rect x="2" y="2" width="124" height="124" rx="24" ry="24" fill="url(#glow)"/>
  <rect x="2" y="2" width="124" height="124" rx="24" ry="24" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- floor shadow -->
  <ellipse cx="46" cy="113" rx="42" ry="6" fill="#000000" opacity="0.35"/>

  <!-- pile -->
  <g>
    <rect x="10" y="90" width="20" height="20" rx="6" fill="#000000" opacity="0.28"/>
    <rect x="10" y="88" width="20" height="20" rx="6" fill="url(#gMint)"/>
    <rect x="10" y="88" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="11" y="89.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.32"/>

    <rect x="32" y="90" width="20" height="20" rx="6" fill="#000000" opacity="0.28"/>
    <rect x="32" y="88" width="20" height="20" rx="6" fill="url(#gGold)"/>
    <rect x="32" y="88" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="33" y="89.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.32"/>

    <rect x="54" y="90" width="20" height="20" rx="6" fill="#000000" opacity="0.28"/>
    <rect x="54" y="88" width="20" height="20" rx="6" fill="url(#gCoral)"/>
    <rect x="54" y="88" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="55" y="89.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.32"/>

    <rect x="10" y="68" width="20" height="20" rx="6" fill="#000000" opacity="0.28"/>
    <rect x="10" y="66" width="20" height="20" rx="6" fill="url(#gAmber)"/>
    <rect x="10" y="66" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="11" y="67.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.32"/>

    <rect x="32" y="68" width="20" height="20" rx="6" fill="#000000" opacity="0.28"/>
    <rect x="32" y="66" width="20" height="20" rx="6" fill="url(#gOrchid)"/>
    <rect x="32" y="66" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="33" y="67.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.32"/>

    <rect x="10" y="46" width="20" height="20" rx="6" fill="#000000" opacity="0.28"/>
    <rect x="10" y="44" width="20" height="20" rx="6" fill="url(#gPeri)"/>
    <rect x="10" y="44" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="11" y="45.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.32"/>

    <rect x="32" y="46" width="20" height="20" rx="6" fill="#000000" opacity="0.28"/>
    <rect x="32" y="44" width="20" height="20" rx="6" fill="url(#gSky)"/>
    <rect x="32" y="44" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="33" y="45.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.32"/>
  </g>

  <!-- motion trail -->
  <rect x="78" y="56" width="4" height="10" rx="2" fill="url(#gSky)" opacity="0.3"/>
  <rect x="78" y="70" width="4" height="12" rx="2" fill="url(#gSky)" opacity="0.2"/>
  <rect x="78" y="86" width="4" height="14" rx="2" fill="url(#gSky)" opacity="0.12"/>

  <!-- falling piece glow -->
  <circle cx="80" cy="26" r="50" fill="url(#fallglow)"/>

  <!-- falling T piece -->
  <g>
    <rect x="58" y="12" width="20" height="20" rx="6" fill="#000000" opacity="0.3"/>
    <rect x="58" y="10" width="20" height="20" rx="6" fill="url(#gSky)"/>
    <rect x="58" y="10" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="59" y="11.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.35"/>

    <rect x="80" y="12" width="20" height="20" rx="6" fill="#000000" opacity="0.3"/>
    <rect x="80" y="10" width="20" height="20" rx="6" fill="url(#gSky)"/>
    <rect x="80" y="10" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="81" y="11.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.35"/>

    <rect x="102" y="12" width="20" height="20" rx="6" fill="#000000" opacity="0.3"/>
    <rect x="102" y="10" width="20" height="20" rx="6" fill="url(#gSky)"/>
    <rect x="102" y="10" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="103" y="11.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.35"/>

    <rect x="80" y="34" width="20" height="20" rx="6" fill="#000000" opacity="0.3"/>
    <rect x="80" y="32" width="20" height="20" rx="6" fill="url(#gSky)"/>
    <rect x="80" y="32" width="20" height="20" rx="6" fill="url(#sheen)"/>
    <rect x="81" y="33.5" width="18" height="2" rx="1" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
