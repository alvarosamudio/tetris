<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#131313"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gCoral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fa5a5a"/>
      <stop offset="1" stop-color="#c84848"/>
    </linearGradient>
    <linearGradient id="gPeri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e82ff"/>
      <stop offset="1" stop-color="#5868cc"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffaa28"/>
      <stop offset="1" stop-color="#cc881f"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd246"/>
      <stop offset="1" stop-color="#cca838"/>
    </linearGradient>
    <linearGradient id="gMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46c88c"/>
      <stop offset="1" stop-color="#38a070"/>
    </linearGradient>
    <linearGradient id="gOrchid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c85af0"/>
      <stop offset="1" stop-color="#a048c0"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ac8ff"/>
      <stop offset="1" stop-color="#48a0cc"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="22" ry="22" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="22" ry="22" fill="url(#glow)"/>

  <!-- falling piece -->
  <g filter="url(#drop)">
    <rect x="88" y="16" width="22" height="22" rx="5" fill="url(#gSky)"/>
    <rect x="88" y="16" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="88" y="40" width="22" height="22" rx="5" fill="url(#gSky)"/>
    <rect x="88" y="40" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>

  <!-- pile -->
  <g filter="url(#drop)">
    <rect x="92" y="16" width="22" height="22" rx="5" fill="url(#gOrchid)"/>
    <rect x="92" y="16" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="68" y="40" width="22" height="22" rx="5" fill="url(#gAmber)"/>
    <rect x="68" y="40" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="92" y="40" width="22" height="22" rx="5" fill="url(#gCoral)"/>
    <rect x="92" y="40" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="44" y="64" width="22" height="22" rx="5" fill="url(#gPeri)"/>
    <rect x="44" y="64" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="68" y="64" width="22" height="22" rx="5" fill="url(#gGold)"/>
    <rect x="68" y="64" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="92" y="64" width="22" height="22" rx="5" fill="url(#gMint)"/>
    <rect x="92" y="64" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="20" y="88" width="22" height="22" rx="5" fill="url(#gSky)"/>
    <rect x="20" y="88" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="44" y="88" width="22" height="22" rx="5" fill="url(#gMint)"/>
    <rect x="44" y="88" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="68" y="88" width="22" height="22" rx="5" fill="url(#gAmber)"/>
    <rect x="68" y="88" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="92" y="88" width="22" height="22" rx="5" fill="url(#gPeri)"/>
    <rect x="92" y="88" width="22" height="22" rx="5" fill="url(#sheen)"/>
  </g>
</svg>
