version: "1"

package:
  id: org.deepinenespanol.dropix
  name: Dropix
  version: 0.4.0.0
  kind: app
  description: |
    Block puzzle game for Deepin desktop built with Qt6 and DTK6.
    Features pill-shaped blocks, 8-bit music and high score tracking.

command:
  - /opt/apps/org.deepinenespanol.dropix/files/bin/dropix

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

build: |
  dpkg-deb -X linglong/sources/dropix_*.deb $PREFIX/
  mv $PREFIX/usr/bin $PREFIX/bin
  mv $PREFIX/usr/share $PREFIX/share
  rm -rf $PREFIX/usr
  sed -i 's#Exec=/usr/bin/dropix#Exec=/opt/apps/org.deepinenespanol.dropix/files/bin/dropix#' \
      $PREFIX/share/applications/org.deepinenespanol.dropix.desktop

sources: []
