version: "1"

package:
  id: org.deepinenespanol.tetris
  name: Tetris
  version: 0.2.0.0
  kind: app
  description: |
    Classic Tetris game for Deepin desktop built with Qt6 and DTK6.
    Features pill-shaped blocks, 8-bit music and high score tracking.

command:
  - tetris

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

build: |
  apt-get update -y
  apt-get install -y --no-install-recommends \
    cmake \
    git \
    qt6-base-dev \
    qt6-multimedia-dev \
    libdtk6widget-dev \
    pkg-config \
    qt6-l10n-tools

  git clone --depth=1 https://github.com/alvarosamudio/tetris.git /tmp/tetris
  cd /tmp/tetris
  cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release
  cmake --build build -j$(nproc)
  cmake --install build --prefix ${PREFIX}

sources: []
