version: "1"

package:
  id: org.deepinenespanol.tetris
  name: Tetris
  version: 0.3.0.0
  kind: app
  description: |
    Classic Tetris game for Deepin desktop built with Qt6 and DTK6.
    Features pill-shaped blocks, 8-bit music and high score tracking.

command:
  - /opt/apps/org.deepinenespanol.tetris/files/bin/tetris

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

build: |
  dpkg-deb -X linglong/sources/tetris_*.deb $PREFIX/
  mv $PREFIX/usr/bin $PREFIX/bin
  mv $PREFIX/usr/share $PREFIX/share
  rm -rf $PREFIX/usr
  sed -i 's#Exec=/usr/bin/tetris#Exec=/opt/apps/org.deepinenespanol.tetris/files/bin/tetris#' \
      $PREFIX/share/applications/org.deepinenespanol.tetris.desktop

sources: []
